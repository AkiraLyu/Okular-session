name: Packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck desktop-file-utils
      - name: Validate scripts and desktop launcher
        run: |
          bash -n okular-session.sh install.sh packaging/build.sh packaging/stage.sh packaging/arch/PKGBUILD
          shellcheck okular-session.sh install.sh packaging/build.sh packaging/stage.sh
          desktop-file-validate okular-session.desktop

  build:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ubuntu:24.04
          - format: arch
            container: archlinux:base-devel
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Debian build tools
        if: matrix.format == 'deb'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates dpkg-dev desktop-file-utils
      - name: Install Arch build tools
        if: matrix.format == 'arch'
        run: pacman -Syu --noconfirm --needed git desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.0.0+git${GITHUB_SHA:0:7}"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            version=${REF_NAME#v}
          fi
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build Debian package
        if: matrix.format == 'deb'
        run: bash packaging/build.sh deb "$PACKAGE_VERSION"
      - name: Build Arch package as an unprivileged user
        if: matrix.format == 'arch'
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env PACKAGE_VERSION="$PACKAGE_VERSION" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash packaging/build.sh arch "$PACKAGE_VERSION"
      - name: Verify Debian package installation
        if: matrix.format == 'deb'
        run: apt-get install --yes --no-install-recommends ./dist/*.deb
      - name: Verify Arch package installation
        if: matrix.format == 'arch'
        run: pacman -U --noconfirm dist/*.pkg.tar.zst
      - name: Verify installed files
        run: |
          test -x /usr/bin/okular-session
          cmp okular-session.sh /usr/bin/okular-session
          cmp okular-session.desktop /usr/share/applications/okular-session.desktop
          cmp README.md /usr/share/doc/okular-session/README.md
          bash -n /usr/bin/okular-session
          desktop-file-validate /usr/share/applications/okular-session.desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum -- *.deb *.pkg.tar.zst install.sh > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

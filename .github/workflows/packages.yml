name: Packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck desktop-file-utils python3
      - name: Validate scripts and desktop launcher
        run: |
          for script in okular-session.sh install.sh packaging/*.sh packaging/arch/PKGBUILD.in; do
            bash -n "$script"
          done
          shellcheck -x okular-session.sh install.sh packaging/*.sh
          desktop-file-validate okular-session.desktop
          python3 -B -m unittest discover -s tests -v

  build:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ubuntu:24.04
          - format: arch
            container: archlinux:base-devel
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install Debian build tools
        if: matrix.format == 'deb'
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates dpkg-dev desktop-file-utils pandoc lintian
      - name: Install Arch build tools
        if: matrix.format == 'arch'
        run: pacman -Syu --noconfirm --needed git desktop-file-utils pandoc-cli namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.0.0+git${GITHUB_SHA:0:7}-1"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[1-9][0-9]*$ ]] || exit 1
            version=${REF_NAME#v}
          fi
          source_date_epoch=$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"
      - name: Build and verify packages
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
          OKULAR_SESSION_TEST_CONTAINER: '1'
        run: bash packaging/check.sh "$PACKAGE_FORMAT" "$PACKAGE_VERSION" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Prepare release assets
        run: cp install.sh dist/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash packaging/publish.sh "$RELEASE_TAG" dist
